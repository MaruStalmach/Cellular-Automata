[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cellular-automata"
version = "0.1.0"
description = "Configurable 3D cellular automaton for simulating microbial communities and biofilms, with OpenGL rendering."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
# interactive OpenGL renderer (needs OpenGL >= 4.3); headless runs don't need it
render = [
    "glfw>=2.10.0",
    "pyglm>=2.8.3",
    "pyopengl>=3.1.10",
    "pyopengl-accelerate>=3.1.10",
]
# extra packages used by examples/, research/ and tools/ (not needed by the library itself)
research = [
    "imageio>=2.34",
    "pandas>=2.2",
    "psutil>=5.9",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.15.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cellular_automata = ["rendering/shaders/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src/cellular_automata"]
warn_unused_ignores = true

# no type information published for these
[[tool.mypy.overrides]]
module = ["glfw", "glfw.*", "OpenGL", "OpenGL.*", "scipy", "scipy.*", "glm"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
