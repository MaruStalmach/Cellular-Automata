[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cellular-automata"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "glfw>=2.10.0",
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pyglm>=2.8.3",
    "pyopengl>=3.1.10",
    "pyopengl-accelerate>=3.1.10",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]