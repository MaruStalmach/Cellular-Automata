name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # headless on purpose: no OpenGL packages or libGL, so tests prove the core
      # doesn't need them (ARCH-3 in docs/code-quality-plan.md)
      - name: Install dependencies
        run: uv sync --locked --extra research

      - name: Tests
        run: uv run pytest -q

  render-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # PyOpenGL loads libGL on import; there is no display, so this only checks imports
      - name: Install OpenGL runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1

      - name: Install dependencies
        run: uv sync --locked --extra render

      - name: Renderer imports
        run: uv run python -c "import cellular_automata.rendering.Renderer, cellular_automata.rendering.Shader"

      # the parser imports the renderer lazily; check that path finds the real class
      - name: Parser finds the renderer
        run: uv run python -c "from cellular_automata.config.Parser import renderer_class; assert renderer_class().__name__ == 'CARenderer'"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      # with the render extra, so the renderer is checked against PyGLM's types as it is locally
      - name: Type check
        run: uv run --extra render mypy
